[package]
name = "campus"
version = "0.1.0"
description = "Campus — organização acadêmica"
authors = ["Campus"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "campus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0" }
tauri-plugin-log = "2"
# Calendário (spec 01): SQLite embarcado e UUID v4 de id.
# `bundled` compila o amalgamation do SQLite, então a usuária não precisa ter
# SQLite instalado no Windows.
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
